events { worker_connections 1024; }
http {
    server_tokens off;
    # Only the dedicated TLS gateway is trusted to supply client addresses.
    set_real_ip_from gateway;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=api:10m rate=8r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    limit_req_status 429;
    log_format safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    upstream web { server frontend:3000; }
    upstream api_backend { server backend:8000; }
    server {
        listen 8080;
        client_max_body_size 28m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        location ~ ^/(api/auth/(login|reset-password)/|admin/login/) {
            limit_req zone=login burst=4 nodelay;
            proxy_pass http://api_backend;
        }
        location = /api/upload/ {
            limit_req zone=upload burst=3 nodelay;
            proxy_pass http://api_backend;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_buffering off;
            proxy_pass http://api_backend;
        }
        location /admin/ {
            limit_req zone=api burst=15 nodelay;
            proxy_pass http://api_backend;
        }
        location /static/ { proxy_pass http://api_backend; }
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_pass http://web;
        }
    }
}
